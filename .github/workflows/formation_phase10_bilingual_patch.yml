name: Formation v4.5 Phase10 bilingual section patch safety

on:
  push:
    paths:
      - "src/apply_formation_phase10_patch.py"
      - "tests/test_formation_phase10_patch.py"
      - ".github/workflows/formation_phase10_bilingual_patch.yml"
  workflow_dispatch:

jobs:
  patch-safety:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax and non-destructive regression tests
        run: |
          python -W error -m py_compile src/apply_formation_phase10_patch.py
          python -W error -m unittest discover -s tests -p 'test_formation_phase10_patch.py' -v
      - name: Scope declaration
        run: |
          echo "This CI tests source-anchored patch safety only."
          echo "Original RC1 manuscript TeX is not checked into GitHub."
          echo "This workflow does not compile the full English/Korean papers."
