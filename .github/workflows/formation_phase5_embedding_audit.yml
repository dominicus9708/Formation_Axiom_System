name: Formation v4.5 phase-5 multisort embedding replay

on:
  push:
    paths:
      - "src/formation_multirelation_embedding_audit.py"
      - "src/formation_embedding_composition_audit.py"
      - "results/formation_multirelation_embedding_audit.json"
      - "results/formation_embedding_composition_audit.json"
      - ".github/workflows/formation_phase5_embedding_audit.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: |
          python -W error -m py_compile src/formation_multirelation_embedding_audit.py src/formation_embedding_composition_audit.py
      - name: Recompute finite witness results
        run: |
          mkdir -p phase5-output
          PYTHONHASHSEED=731 python -W error src/formation_multirelation_embedding_audit.py --output-dir phase5-output
          PYTHONHASHSEED=731 python -W error src/formation_embedding_composition_audit.py --output-dir phase5-output
      - name: Compare complete JSON bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('formation_multirelation_embedding_audit.json','formation_embedding_composition_audit.json'):
              assert (Path('results')/name).read_bytes()==(Path('phase5-output')/name).read_bytes(),name
              print('REPRODUCED',name)
          PY
