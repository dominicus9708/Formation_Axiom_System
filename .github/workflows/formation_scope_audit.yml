name: Formation v4.5 scope-boundary verification

on:
  push:
    paths:
      - "src/formation_negative_stage_audit.py"
      - "src/formation_semantic_boundary_audit.py"
      - "results/formation_negative_stage_audit.json"
      - "results/formation_semantic_boundary_cases.json"
      - ".github/workflows/formation_scope_audit.yml"
  workflow_dispatch:

jobs:
  source_locked_scope_audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source without warnings
        run: |
          python -W error -m py_compile src/formation_negative_stage_audit.py src/formation_semantic_boundary_audit.py
      - name: Independently regenerate finite negative and staged results
        run: |
          mkdir -p scope-generated
          python -W error src/formation_negative_stage_audit.py --output-dir scope-generated
          python -W error src/formation_semantic_boundary_audit.py --output-dir scope-generated
      - name: Compare generated outputs against frozen repository results
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ('formation_negative_stage_audit.json', 'formation_semantic_boundary_cases.json'):
              expected = Path('results') / filename
              actual = Path('scope-generated') / filename
              assert actual.read_bytes() == expected.read_bytes(), f'mismatch: {filename}'
              print('REPRODUCED', filename)
          PY
