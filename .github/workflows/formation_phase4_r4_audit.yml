name: Formation v4.5 phase-4 R4 boundary replay

on:
  push:
    paths:
      - "src/formation_embedding_r4_scope.py"
      - "results/formation_embedding_r4_scope.json"
      - ".github/workflows/formation_phase4_r4_audit.yml"
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile with warnings treated as errors
        run: python -W error -m py_compile src/formation_embedding_r4_scope.py
      - name: Recompute and check exact results
        run: |
          mkdir -p phase4-replay
          PYTHONHASHSEED=731 python -W error src/formation_embedding_r4_scope.py --output-dir phase4-replay
          python - <<'PY'
          from pathlib import Path
          name = 'formation_embedding_r4_scope.json'
          got = (Path('phase4-replay') / name).read_bytes()
          expected = (Path('results') / name).read_bytes()
          assert got == expected, 'Phase4 R4 audit not reproducible'
          print('REPRODUCED', name)
          PY
